    attributes:
      label: 요약
      description: 버그에 대한 요약을 입력해주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 상세
      description: 버그에 대한 상세 내용을 입력해주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 환경
      description: 패키지 버전 및 실행 환경에 대해 입력해주세요.
    validations:
      required: false
