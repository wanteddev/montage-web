name: montage-codeql

paths-ignore:
  # build output (incl. committed bundles of local actions)
  - '**/dist'
  - '**/.next'
  # local action sources (action.yml stays scanned by the actions language)
  - '.github/actions/*/src'
  # test fixtures and bundling checks
  - tests
  - '**/*.test.ts'
  - '**/*.test.tsx'
