name: Deploy
on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'SemVer Increment (prepatch = bump alpha, from-package = 버전 변경 없이 레지스트리에 없는 패키지만 배포)'
        required: true
        default: 'prepatch'
        type: choice
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major
          - from-package

env:
  SERVICE: 'Montage web'

permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write # npm trusted publishing
      packages: write # github packages publishing
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App user info
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          if [ -z "$USER_ID" ]; then
            echo "Failed to resolve GitHub App user ID for ${APP_SLUG}[bot]" >&2
            exit 1
          fi
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build packages
        uses: ./.github/actions/package-build
        env:
          MCP_TRACK_CLIENT_ID: ${{ secrets.MCP_TRACK_CLIENT_ID }}

      - run: git config user.name "${{ steps.app-user.outputs.name }}"
      - run: git config user.email "${{ steps.app-user.outputs.email }}"

      - name: Record current version
        id: before
        run: echo "version=$(node -p "require('./lerna.json').version")" >> $GITHUB_OUTPUT

      - name: Publish
        id: publish
        if: ${{ inputs.increment != 'from-package' }}
        # 실패해도 다음 단계에서 레지스트리에 빠진 패키지만 다시 배포한다
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run lerna-deploy ${{ inputs.increment }} --force-publish --concurrency 1 --dist-tag ${{ contains(inputs.increment, 'pre') && 'alpha' || 'latest' }} ${{ contains(inputs.increment, 'pre') && '--conventional-prerelease' || '--conventional-commits' }} --create-release=github --yes

      # 버전 커밋·태그·release는 Publish에서 끝났으므로 from-package는 package.json의
      # 현재 버전 중 레지스트리에 없는 것만 올린다 (버전 변경·커밋·태그를 다시 하지 않음).
      - name: Publish missing packages
        if: ${{ inputs.increment == 'from-package' || steps.publish.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          BEFORE_VERSION: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./lerna.json').version")
          TAG="v$VERSION"
          # 버전 단계 자체가 실패했다면 올릴 버전이 없다 — 재시도가 no-op 성공으로 끝나지 않게 실패 처리
          if [[ "$INCREMENT" != "from-package" && "$VERSION" == "$BEFORE_VERSION" ]]; then
            echo "::error::버전이 $VERSION 그대로입니다 — 버전 단계에서 실패해 재시도할 배포가 없습니다"
            exit 1
          fi
          # 버전 기록(커밋 · 태그 · release)이 원격에 모두 남은 버전만 배포한다.
          # push나 release 생성에서 실패했다면 기록 없는 버전이 npm에 올라가지 않게 멈춘다.
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::원격에 $TAG 태그가 없습니다 — 버전 기록을 먼저 복구하세요"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "origin/$GITHUB_REF_NAME"; then
            echo "::error::$TAG 버전 커밋이 origin/$GITHUB_REF_NAME에 없습니다 — 버전 기록을 먼저 복구하세요"
            exit 1
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG GitHub release가 없습니다 — release를 먼저 만드세요"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then DIST_TAG=alpha; else DIST_TAG=latest; fi
          pnpm exec lerna publish from-package --concurrency 1 --dist-tag "$DIST_TAG" --yes

      - name: Get published version
        id: version
        run: |
          git pull
          VERSION=$(node -e "console.log(require('./lerna.json').version)")
          VERSION_PATH=$(echo $VERSION | sed 's/\.[0-9]*$/.x/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_path=$VERSION_PATH" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_path: ${{ steps.version.outputs.version_path }}

  close-milestone:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && !contains(inputs.increment, 'pre') }}
    permissions:
      issues: write
    steps:
      - name: Close released milestone
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          set -euo pipefail
          # prerelease(4.0.0-alpha.N)는 마일스톤(4.0.0)을 닫지 않는다
          if [[ -z "$VERSION" || "$VERSION" == *-* ]]; then
            echo "::notice::stable 버전이 아님($VERSION) — skip"
            exit 0
          fi
          MILESTONE=$(gh api --paginate "repos/${{ github.repository }}/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | \"\(.number) \(.open_issues)\"")
          if [ -z "$MILESTONE" ]; then
            echo "::notice::열린 $VERSION 마일스톤 없음 — skip"
            exit 0
          fi
          read -r NUMBER OPEN_ISSUES <<< "$MILESTONE"
          if [ "$OPEN_ISSUES" -gt 0 ]; then
            echo "::warning::$VERSION 마일스톤에 열린 이슈/PR ${OPEN_ISSUES}건이 남아 있어 닫지 않음"
            exit 0
          fi
          gh api -X PATCH "repos/${{ github.repository }}/milestones/$NUMBER" -f state=closed --silent
          echo "::notice::$VERSION 마일스톤(#$NUMBER) 완료 처리"

  deploy-success:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get current versions
        run: |
          git pull
          echo "RELEASE_URL=${{ github.event.repository.html_url }}/releases" >> $GITHUB_ENV
          RELEASE=$(printf "%s" "$(git describe --tags)")
          RELEASE="$(echo "$RELEASE" | sed -z 's/\n/\\n/g')"
          echo "RELEASE=${RELEASE}" >> $GITHUB_ENV

      - name: Post Slack Message - Deploy Success
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "",
              "attachments": [
                {
                  "color": "00E5BA",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*${{ env.SERVICE }} ${{ inputs.increment }} 배포 완료*"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "배포된 버전"
                      }
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ env.RELEASE }}"
                      },
                      "accessory": {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "릴리즈 보러가기"
                        },
                        "value": "goto_frontend_design_system_release",
                        "url": "${{ env.RELEASE_URL }}",
                        "action_id": "button-action"
                      }
                    }
                  ]
                }
              ]
            }' \
            "$SLACK_WEBHOOK_URL"

  deploy-docs:
    uses: ./.github/workflows/docs-deploy.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && !contains(inputs.increment, 'pre') && (inputs.increment == 'minor' || inputs.increment == 'major') }}
    with:
      server_type: www
      version_path: ${{ needs.deploy.outputs.version_path || '' }}

  deploy-mcp-server:
    uses: ./.github/workflows/mcp-deploy.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && !contains(inputs.increment, 'pre') && (inputs.increment == 'minor' || inputs.increment == 'major') }}
    with:
      server_type: www
