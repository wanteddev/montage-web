name: Deploy
on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'SemVer Increment (prepatch = bump alpha)'
        required: true
        default: 'prepatch'
        type: choice
        options:
          - prerelease
          - prepatch
          - preminor
          - premajor
          - patch
          - minor
          - major

env:
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
  GH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
  SERVICE: 'Montage web'

jobs:
  deploy:
    permissions:
      packages: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build packages
        uses: ./.github/actions/package-build

      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: echo ""
      - name: Publish
        run: pnpm run lerna-deploy ${{ inputs.increment }} --force-publish --dist-tag ${{ contains(inputs.increment, 'pre') && 'alpha' || 'latest' }} ${{ contains(inputs.increment, 'pre') && '--conventional-prerelease' || '--conventional-commits' }} --create-release=github --yes

      - name: Get published version
        id: version
        run: |
          git pull
          VERSION=$(node -e "console.log(require('./lerna.json').version)")
          VERSION_PATH=$(echo $VERSION | sed 's/\.[0-9]*$/.x/')
          echo "version_path=$VERSION_PATH" >> $GITHUB_OUTPUT
    outputs:
      version_path: ${{ steps.version.outputs.version_path }}

  deploy-success:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get current versions
        run: |
          git pull
          echo "RELEASE_URL=${{ github.event.repository.html_url }}/releases" >> $GITHUB_ENV
          RELEASE=$(printf "%s" "$(git describe --tags)")
          RELEASE="$(echo "$RELEASE" | sed -z 's/\n/\\n/g')"
          echo "RELEASE=${RELEASE}" >> $GITHUB_ENV

      - name: Post Slack Message - Deploy Success
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.DEPLOY_SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "",
              "attachments": [
                {
                  "color": "00E5BA",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*${{ env.SERVICE }} ${{ inputs.increment }} 배포 완료*"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "배포된 버전"
                      }
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ env.RELEASE }}"
                      },
                      "accessory": {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "릴리즈 보러가기"
                        },
                        "value": "goto_frontend_design_system_release",
                        "url": "${{ env.RELEASE_URL }}",
                        "action_id": "button-action"
                      }
                    }
                  ]
                }
              ]
            }' \
            "$SLACK_WEBHOOK_URL"

  deploy-docs:
    uses: ./.github/workflows/docs-deploy.yml
    secrets: inherit
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && !contains(inputs.increment, 'pre') && (inputs.increment == 'minor' || inputs.increment == 'major') }}
    with:
      server_type: www
      version_path: ${{ needs.deploy.outputs.version_path || '' }}

  deploy-mcp-server:
    uses: ./.github/workflows/mcp-deploy.yml
    secrets: inherit
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && !contains(inputs.increment, 'pre') && (inputs.increment == 'minor' || inputs.increment == 'major') }}
    with:
      server_type: www
