name: PR Test and Size Limit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "figma/**"
      - ".github/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  size-limit:
    if: ${{ github.event.pull_request.draft == false && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build packages
        uses: ./.github/actions/package-build
        with:
          cache: false

      - name: Run Size Limit
        uses: andresz1/size-limit-action@v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          skip_step: build

  unit-test:
    if: ${{ github.event.pull_request.draft == false && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build packages
        uses: ./.github/actions/package-build
        with:
          cache: false

      - name: Run Unit Test
        run: pnpm run test:unit --silent --no-cache

  visual-test:
    if: ${{ github.event.pull_request.draft == false && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build packages
        uses: ./.github/actions/package-build
        with:
          cache: false

      - name: Install playwright
        run: pnpm dlx playwright install --with-deps

      - name: Run Visual Test
        run: pnpm run test:visual

  commonjs-test:
    if: ${{ github.event.pull_request.draft == false && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build packages
        uses: ./.github/actions/package-build
        with:
          cache: false

      - name: Run CommonJS Test
        run: pnpm run test:commonjs
