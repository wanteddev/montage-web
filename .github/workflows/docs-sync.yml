name: Docs Sync
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: true
        default: 'mobile'
        type: choice
        options:
          - 'mobile'
          - 'design'

env:
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

jobs:
  sync-mobile-docs:
    if: inputs.platform == 'mobile'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract current branch name
        shell: bash
        run: echo "base_branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract-current-branch

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Check existing PR and checkout branch
        id: check-branch
        run: |
          EXISTING_BRANCH=$(gh pr list --base ${{ steps.extract-current-branch.outputs.base_branch }} --search "docs: sync from mobile document" --json headRefName --jq '.[0].headRefName')

          if [ -n "$EXISTING_BRANCH" ]; then
            echo "branch=$EXISTING_BRANCH" >> $GITHUB_OUTPUT
            echo "branch_exists=true" >> $GITHUB_OUTPUT

            git fetch origin $EXISTING_BRANCH
            git checkout $EXISTING_BRANCH
          else
            BRANCH="feature/sync-docs/${{ github.run_id }}"

            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "branch_exists=false" >> $GITHUB_OUTPUT
            git checkout -b $BRANCH
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Generate Mobile Docs
        uses: ./.github/actions/generate-mobile-docs
        timeout-minutes: 15

      - name: Get GitHub App user info
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> $GITHUB_OUTPUT
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> $GITHUB_OUTPUT

      - run: git config user.name "${{ steps.app-user.outputs.name }}"
      - run: git config user.email "${{ steps.app-user.outputs.email }}"

      - name: Commit and push to existing branch
        run: |
          git commit -am "docs: sync with mobile docs" --no-verify || echo "No changes to commit"
          git push origin ${{ steps.check-branch.outputs.branch }}

      - name: Create New PR
        if: steps.check-branch.outputs.branch_exists == 'false'
        run: |
          gh pr create -B ${{ steps.extract-current-branch.outputs.base_branch }} -H ${{ steps.check-branch.outputs.branch }} --title "docs: sync from mobile document" --body "sync from mobile document"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

  sync-design-docs:
    if: inputs.platform == 'design'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract current branch name
        shell: bash
        run: echo "base_branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract-current-branch

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Check existing PR and checkout branch
        id: check-branch
        run: |
          EXISTING_BRANCH=$(gh pr list --base ${{ steps.extract-current-branch.outputs.base_branch }} --search "docs: sync from design document" --json headRefName --jq '.[0].headRefName')

          if [ -n "$EXISTING_BRANCH" ]; then
            echo "branch=$EXISTING_BRANCH" >> $GITHUB_OUTPUT
            echo "branch_exists=true" >> $GITHUB_OUTPUT

            git fetch origin $EXISTING_BRANCH
            git checkout $EXISTING_BRANCH
          else
            BRANCH="feature/sync-docs/${{ github.run_id }}"

            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "branch_exists=false" >> $GITHUB_OUTPUT
            git checkout -b $BRANCH
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Generate Mobile Docs
        timeout-minutes: 15
        run: |
          pnpm -F design-docs-sync start

      - name: Get GitHub App user info
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> $GITHUB_OUTPUT
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> $GITHUB_OUTPUT

      - run: git config user.name "${{ steps.app-user.outputs.name }}"
      - run: git config user.email "${{ steps.app-user.outputs.email }}"

      - name: Commit and push to existing branch
        run: |
          git commit -am "docs: sync with design docs" --no-verify || echo "No changes to commit"
          git push origin ${{ steps.check-branch.outputs.branch }}

      - name: Create New PR
        if: steps.check-branch.outputs.branch_exists == 'false'
        run: |
          gh pr create -B ${{ steps.extract-current-branch.outputs.base_branch }} -H ${{ steps.check-branch.outputs.branch }} --title "docs: sync from design document" --body "sync from design document"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
