name: Figma icon sync
on:
  workflow_call:
    inputs:
      ignore_icons:
        type: string
        description: 'ignore icons separated by comma'
        required: false
        default: ''
      platform:
        type: string
        description: 'platform'
        required: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - uses: actions/github-script@v7
        env:
          FIGMA_TOKEN: ${{ env.FIGMA_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          IGNORE_ICONS: ${{ inputs.ignore_icons }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const platform = process.env.PLATFORM;

            const ignoreIcons = (process.env.IGNORE_ICONS || '').split(',');

            const kebabCase = (name) =>
              name
                .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
                .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
                .toLowerCase();

            const TOKEN = process.env.FIGMA_TOKEN;
            const URL_BASE = 'https://api.figma.com/v1/files';
            const URL_BASE_IMAGES = 'https://api.figma.com/v1/images';

            const FILE_KEY = '7RHtWV3Pw6I98UEDjbx5V1';

            // Icon/Assets/Normal
            const ROOT_TRAVERSE_IDS = [
              // Components
              '26882:89366',
              // 0 Theme
              '10077:24937',
              // Icon
              '14852:37729',
              // '' Section
              '14854:45087',
              // Solid
              '14854:45155',
              // Content
              '26894:99058',
            ];

            // Icon/Assets/Color
            const ROOT_TRAVERSE_COLOR_IDS = [
              // Components
              '26882:89366',
              // 0 Theme
              '10077:24937',
              // Icon
              '14852:37729',
              // '' Section
              '14854:45087',
              // Color
              '14854:45156',
              // Content
              '26900:94433',
            ];

            // Icon/Navigation
            const ROOT_TRAVERSE_NAVIGATION_IDS = [
              // Components
              '26882:89366',
              // 0 Theme
              '10077:24937',
              // Icon
              '14852:37729',
              // '' Section
              '14854:45087',
              // Navigation
              '14854:45095',
              // Content
              '10077:25083',
            ];

            const getIconComponents = async () => {
              try {
                const fileResponse = await fetch(
                  `${URL_BASE}/${FILE_KEY}?ids=26882-89366`,
                  {
                    method: 'GET',
                    headers: { 'X-FIGMA-TOKEN': TOKEN },
                  },
                );
                const data = await fileResponse.json();

                return await fileRESTResponseToIconComponentsJSON(data);
              } catch (e) {
                throw e;
              }
            };

            const getSVGImages = async (nodeIds) => {
              try {
                const fileResponse = await fetch(
                  `${URL_BASE_IMAGES}/${FILE_KEY}?format=svg&ids=${nodeIds.join(',')}`,
                  {
                    method: 'GET',
                    headers: { 'X-FIGMA-TOKEN': TOKEN },
                  },
                );
                return await fileResponse.json();
              } catch (e) {
                throw e;
              }
            };

            const fileRESTResponseToIconComponentsJSON = async (response) => {
              // ICON
              let parentNode = response.document;
              // ICON COLOR
              let colorParentNode = response.document;
              // ICON NAVIGATION
              let navigationParentNode = response.document;

              ROOT_TRAVERSE_IDS.forEach(
                (id) => (parentNode = parentNode.children.find((a) => a.id === id)),
              );

              ROOT_TRAVERSE_COLOR_IDS.forEach(
                (id) =>
                  (colorParentNode = colorParentNode.children.find((a) => a.id === id)),
              );

              ROOT_TRAVERSE_NAVIGATION_IDS.forEach(
                (id) =>
                  (navigationParentNode = navigationParentNode.children.find(
                    (a) => a.id === id,
                  )),
              );

              const idsToNameAndComponentSetId = {};

              const getIconNames = (nodes, type = '') => {
                if (nodes) {
                  nodes.children.forEach((component) => {
                    if (component.type === 'COMPONENT_SET') {
                      const components = component.children.filter(
                        (child) => child.type === 'COMPONENT',
                      );

                      if (components) {
                        components.map((child) => {
                          const name =
                            'Icon' +
                            child.name
                              .replace('Name=', '')
                              .replace('name=', '')
                              .replace(/, [\s\S]+/g, '')
                              .split(/[^a-zA-Z0-9]+/)
                              .map((a) => a.charAt(0).toUpperCase() + a.substring(1))
                              .join('') +
                            type;

                          idsToNameAndComponentSetId[child.id] = [name, component.id];
                        });
                      }
                    }
                  });
                }
              };

              getIconNames(parentNode);
              getIconNames(colorParentNode, 'Color');
              getIconNames(navigationParentNode);

              const nodeIds = Object.keys(idsToNameAndComponentSetId);
              const { images } = await getSVGImages(nodeIds);

              const processNodeId = async (nodeId) => {
                const fileResponse = await fetch(images[nodeId], { method: 'GET' });
                const svg = await fileResponse.text();
                const [name, componentSetId] = idsToNameAndComponentSetId[nodeId];

                const parsedName = name
                  .replace('Icon', '')
                  .replace('Color', '')
                  .split(/[^a-zA-Z0-9]+/)
                  .map((a, i) =>
                    i === 0
                      ? a.charAt(0).toLowerCase() + a.substring(1)
                      : a.charAt(0).toUpperCase() + a.substring(1),
                  )
                  .join('');

                res.push({
                  name,
                  content: svg,
                  id: componentSetId.replace(':', '-'),
                  parsedName,
                });
              };

              console.log('Sleeping for ten seconds to wait for images to exist...');
              await new Promise((resolve) => setTimeout(resolve, 10000));
              console.log('Proceeding....');

              /**
              * @type {Array<{name: string, content: string, id: string, parsedName: string}>}
              */
              const res = [];
              const fails = [];
              await Promise.all(
                nodeIds.map(async (nodeId) => {
                  try {
                    await processNodeId(nodeId);
                  } catch (e) {
                    fails.push(nodeId);
                    console.log('Failed once:', nodeId, e);
                  }
                }),
              );
              console.log(`Retrying ${fails.length} failure(s)...`);
              await Promise.all(
                fails.map(async (nodeId) => {
                  try {
                    await processNodeId(nodeId);
                  } catch (e) {
                    console.error(e);
                    console.log(
                      'Failed again:',
                      nodeId,
                      images[nodeId],
                      ...idsToNameAndComponentSetId[nodeId],
                    );
                  }
                }),
              );

              return res;
            };

            const main = async () => {
              const data = (await getIconComponents()).filter(
                ({ name }) => !ignoreIcons.includes(name),
              );

              switch (platform) {
                case 'android':
                  break;
                case 'ios': {
                  const iconAssets = fs
                    .readdirSync('./Sources/Montage/Asset/Icon.xcassets', 'utf8')
                    .filter(
                      (iconAsset) =>
                        iconAsset.endsWith('.imageset') &&
                        !ignoreIcons.includes(iconAsset.replace('.imageset', '')),
                    );

                  iconAssets.forEach((iconAsset) => {
                    const iconAssetPath = path.join(
                      './Sources/Montage/Asset/Icon.xcassets',
                      iconAsset,
                    );

                    if (fs.existsSync(iconAssetPath)) {
                      fs.rmdirSync(iconAssetPath);
                    }
                  });

                  const promises = [];

                  data.forEach(({ content, parsedName }) => {
                    promises.push(
                      new Promise((resolve, reject) => {
                        try {
                          fs.mkdirSync(
                            path.join(
                              './Sources/Montage/Asset/Icon.xcassets',
                              `${parsedName}.imageset`,
                            ),
                          );

                          fs.writeFileSync(
                            path.join(
                              './Sources/Montage/Asset/Icon.xcassets',
                              `${parsedName}.imageset`,
                              'Contents.json',
                            ),
                            JSON.stringify(
                              {
                                images: [
                                  {
                                    filename: `${parsedName}.svg`,
                                    idiom: 'universal',
                                  },
                                ],
                                info: {
                                  author: 'xcode',
                                  version: 1,
                                },
                                properties: {
                                  'preserves-vector-representation': true,
                                  'template-rendering-intent': 'template',
                                },
                              },
                              null,
                              2,
                            ),
                          );

                          fs.writeFileSync(
                            path.join(
                              './Sources/Montage/Asset/Icon.xcassets',
                              `${parsedName}.imageset`,
                              `${parsedName}.svg`,
                            ),
                            content
                              .replace('width="24"', '')
                              .replace('height="24"', '')
                              .replace('width="12"', '')
                              .replace('height="12"', '')
                              .replace('fill="none"', '')
                              .replace('fill="#171719"', ''),
                          );

                          resolve();
                        } catch (err) {
                          reject(err);
                        }
                      }),
                    );
                  });

                  await Promise.all(promises);

                  const shouldShowFoundations = fs
                    .readdirSync('./Sources/Montage/Asset/Icon.xcassets', 'utf8')
                    .filter((iconAsset) => iconAsset.endsWith('.imageset'));

                  const swiftFileContent = `//\n//  Icon.swift\n//  Montage\n//\n//  Created by Eunyeong Kim on 2021/04/20.\n//\nimport Foundation\n\n/// Montage 번들 내에 포함된 아이콘들의 이름들입니다.\npublic enum Icon: String, CaseIterable {\n    ${shouldShowFoundations.map((iconAsset) => `case ${iconAsset.replace('.imageset', '').sort()}`).join('\n    ')}\n\n    public var name: String { rawValue }\n}\n`;

                  fs.writeFileSync(
                    './Sources/Montage/Icon.swift',
                    swiftFileContent,
                  );
                  break;
                }
              }

              console.log('DONE!');
            };

            await main();

      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Branch And Commit
        run: |
          git branch feature/code-connect/${{ github.run_id }}
          git checkout feature/code-connect/${{ github.run_id }}
          git add .
          git commit -m "feat(${{ inputs.platform }}): add icons synced from figma" --no-verify
          git push origin feature/code-connect/${{ github.run_id }}

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Create New PR
        run: |
          gh pr create -B ${{ steps.extract_branch.outputs.branch }} -H feature/code-connect/${{ github.run_id }} --title "feat(wds,wds-icon): icon figma sync and new code connect publish" --body "icon figma sync and new code connect publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
