name: Visual Test Update screenshots

on:
  workflow_dispatch:

jobs:
  update-screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build packages
        uses: ./.github/actions/package-build

      - name: Install playwright
        run: pnpm dlx playwright install --with-deps --only-shell

      - name: Run Visual Test and update screenshots
        run: pnpm run test:visual --update

      - name: Create Branch And Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(ci): update visual test screenshots" --no-verify
          git push origin ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
