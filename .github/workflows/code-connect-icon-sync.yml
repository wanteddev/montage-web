name: Code Connect Publish And Icon/Figma Sync
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'code connect push 여부'
        type: choice
        required: false
        default: 'true'
        options:
          - true
          - false

env:
  NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

permissions:
  packages: write
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: wanteddev/wds/.github/workflows/figma-icon-sync.yml@main
    with:
      platform: web
      ignore_icons: 'IconLogoInstagramColor,IconSymbol'
      pr_name: 'feat(wds,wds-icon): icon figma sync and new code connect publish'
    secrets: inherit

  publish:
    needs: sync
    runs-on: ubuntu-latest
    if: ${{ inputs.publish == 'true' }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.branch }}

      - name: Node.js install
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@wanteddev'

      - uses: pnpm/action-setup@v2.0.1
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9.1.2
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "::set-output name=pnpm_cache_dir::$(pnpm store path)"

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      - name: Install dependencies
        run: pnpm install

      - uses: actions/cache@v4
        name: Nx cache
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nx-store-

      - name: Build
        run: pnpm run build

      - name: Publish
        run: pnpm run publish:codeconnect --token ${{ env.FIGMA_TOKEN }} --skip-validation --batch-size 50
