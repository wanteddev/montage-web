name: Validate Docs
description: Compile md/mdx files the same way the docs build does and fail on errors

inputs:
  files:
    description: Glob patterns of md/mdx files to validate (newline separated)
    required: false
    default: '**/*.{md,mdx}'
  mobile-source:
    description: Validate original docs from a mobile repository (applies the same transform as generate-mobile-docs)
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.mjs'
