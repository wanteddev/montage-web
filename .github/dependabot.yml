version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Seoul
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    # Dependabot PRs cannot read Actions secrets, so skip jobs that need them
    labels:
      - 'ci: skip slack noti'
      - 'ci: skip document deploy'
